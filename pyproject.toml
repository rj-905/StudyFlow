[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow"
version = "0.1.0"
description = "Multi-agent personalized learning companion with SM-2 spaced repetition."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3.0",
    "chromadb>=0.5.0,<1.0",
    "google-genai>=0.1.0",
    "langchain>=0.2,<1.0",
    "langgraph>=0.1,<1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
